<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="static/css/styletables.css">  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>Tables in HTML</h1>
    <p>Tables are used to display data in a tabular format, with rows and columns.</p>
    <table border="1">
        <tr>
            <th>Country</th>
            <th>Capital</th>
            <th>Population</th>
        </tr>
        <tr>
            <td>Kenya</td>
        <td>Nairobi</td>
        <td>54 million</td>
    </tr>
    <tr>
        <td>Tanzania</td>
        <td>Dodoma</td>
        <td>60 million</td>
    </tr>
    <tr>
        <td>Uganda</td>
        <td>Kampala</td>
        <td>45 million</td>
    </tr>
</body>
</html>
