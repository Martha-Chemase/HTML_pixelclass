<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
<h1>Lists in HTML</h1>
<p>Lists are an essential part of web development and can be used to organize information in a structured manner.</p>
<h2>Ordered List</h2>
<ol>
    <li>Kenya</li>
    <li>Tanzania</li>
    <li>Uganda</li>
</ol>
<h1>Unordered List</h1>
<ul>
    <li>Apple</li>
    <li>Banana</li>
    <li>Orange</li>
</ul>
</body>
</html>
